<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defensa MLOps · Riesgo crediticio</title>
  <style>
    :root{color-scheme:light;--ink:#172b3a;--muted:#465c6d;--accent:#164e63;--paper:#f7f9fb;--line:#b8c9d1;--focus:#006c89}
    *{box-sizing:border-box}
    body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);color:var(--ink);font:18px/1.45 Arial,sans-serif}
    ::selection{background:#b8e0ec;color:#102d39}
    :focus-visible{outline:3px solid var(--focus);outline-offset:5px}
    a{color:var(--accent);text-underline-offset:4px}
    button{font:inherit;color:inherit;caret-color:var(--accent)}
    button{min-height:44px;border:1px solid var(--accent);background:transparent;padding:9px 18px;cursor:pointer;border-radius:4px}
    button:hover{background:#e0edf2}
    button:disabled{opacity:.45;cursor:default;background:transparent}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 4vw;border-bottom:1px solid var(--line)}
    .identity{display:flex;align-items:baseline;gap:20px}
    .identity strong{font-size:19px}.identity span{font-size:15px;color:var(--muted)}
    .quiet{font-size:15px;border-color:var(--line)}
    main{overflow:auto;scrollbar-color:#8aa9b6 var(--paper);scrollbar-width:thin}
    article{min-height:100%;max-width:1680px;margin:auto;padding:34px 4vw;display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.25fr);align-items:center;gap:5vw}
    h1{font-size:clamp(34px,3.4vw,56px);line-height:1.08;letter-spacing:-.025em;margin:0 0 22px;font-weight:700;text-wrap:balance}
    h1:focus{outline:none}
    article.closing{display:flex;align-items:center;justify-content:center;text-align:center}
    .closing figure,.closing section>:not(h1){display:none}
    .closing h1{margin:0}
    article.scaling{grid-template-columns:1fr 1fr;gap:18px 32px;align-content:center;align-items:start}
    .scaling>section{display:contents}
    .scaling h1{grid-column:1;grid-row:1;margin:0;font-size:40px}
    .scaling .description{grid-column:1;grid-row:2;margin:0;max-width:none;font-size:20px}
    .scaling #commands{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .scaling .links{grid-column:1/-1;grid-row:4;margin:0}
    .scaling figure{grid-column:2;grid-row:1/3}
    .scaling .evidence img{max-height:140px}
    @media(max-width:900px){article.scaling{display:flex;flex-direction:column}.scaling>section{display:block}.scaling #commands{display:block}.scaling figure{width:100%}.scaling .evidence img{max-height:none}}
    .description{font-size:clamp(19px,1.6vw,24px);line-height:1.45;margin:0 0 20px}
    .points{padding-left:22px;margin:0 0 23px;font-size:19px}
    .points li+li{margin-top:8px}
    .links{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:22px}
    .links a{font-size:17px;font-weight:700;padding:5px 0}
    .command{margin:15px 0 0}
    .command-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:14px;color:var(--muted)}
    .copy{padding:5px 12px;min-height:36px;font-size:14px}
    pre{margin:0;padding:16px;background:#e9f0f4;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 Consolas,monospace;tab-size:2}
    .code-comment{color:var(--muted)}
    .expected{margin:10px 0 0;font-size:15px;color:var(--muted);max-width:52ch}
    figure{margin:0;min-width:0}
    .evidence{display:flex;align-items:center;justify-content:center;width:100%;padding:0;background:transparent;border:none;border-radius:0;min-height:0}
    .evidence:hover{background:transparent}
    .evidence img{display:block;width:100%;height:auto;max-height:calc(100dvh - 300px);object-fit:contain}
    figcaption{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-top:14px;font-size:14px;color:var(--muted)}
    .enlarge{white-space:nowrap;min-height:36px;padding:5px 10px;font-size:14px;border-color:var(--line)}
    footer{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:15px 4vw;border-top:1px solid var(--line);background:var(--paper)}
    .position{font-variant-numeric:tabular-nums;min-width:90px;font-size:16px}
    nav{display:flex;gap:10px}.primary{background:var(--accent);color:white}.primary:hover{background:#0d3d50}.primary:disabled{background:var(--accent)}
    .status{position:fixed;left:50%;bottom:93px;transform:translateX(-50%);padding:10px 18px;background:var(--ink);color:white;font-size:15px;max-width:90vw;z-index:3}
    .status:empty{display:none}
    dialog{width:min(96vw,1700px);max-width:none;max-height:96dvh;padding:18px;border:0;background:var(--paper);color:var(--ink)}
    dialog::backdrop{background:rgb(10 29 39 / .85)}
    .dialog-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}
    dialog img{display:block;width:100%;max-height:calc(96dvh - 115px);object-fit:contain}
    noscript{padding:30px}
    @media(min-width:1000px) and (max-height:900px){article{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:12px;padding-bottom:12px;gap:3vw}h1{font-size:40px;margin-bottom:15px}.description{font-size:20px;margin-bottom:16px}.points{font-size:17px;margin-bottom:16px}.points li+li{margin-top:5px}.links{margin-top:15px}pre{padding:12px;font-size:13px}.command{margin-top:10px}.evidence img{max-height:calc(100dvh - 280px)}}
    @media(max-width:900px){body{height:auto;min-height:100dvh;grid-template-rows:auto 1fr auto}header{padding:16px 22px}.identity{display:block}.identity span{display:block;margin-top:3px}article{grid-template-columns:1fr;align-items:start;padding:30px 22px;gap:32px}h1{font-size:36px}.description{max-width:50ch}.points{max-width:60ch}.evidence img{max-height:none}footer{flex-wrap:wrap;padding:14px 22px;gap:15px}nav{margin-left:auto}nav button{padding:9px 14px}figcaption{align-items:center}dialog{padding:12px}.dialog-bar{font-size:15px}}
    @media(prefers-reduced-motion:no-preference){article{animation:arrive .22s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{filter:blur(1px)}to{filter:blur(0)}}}
    @media print{body{height:auto}header,footer,.command-top button,.enlarge{display:none}article{display:block}figure{margin-top:25px}.evidence img{max-height:none}}
  </style>
</head>

      },
      {
        title: 'Aumento y reducción de réplicas',
        scaling: true,
        description: 'Se aumentó la API de tres a cinco copias para ampliar su capacidad y después se volvió a tres.',
        commands: [

    const byId = id => document.getElementById(id);
    let current = 0;
    let statusTimer;
    function notify(message) {
      clearTimeout(statusTimer);
      byId('status').textContent = message;
      statusTimer = setTimeout(() => { byId('status').textContent = ''; }, 3500);
    }
    async function copyCommand(button, code) {
      try {
        await navigator.clipboard.writeText(code.textContent);
        notify('Contenido copiado.');
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(code);
        selection.removeAllRanges();
        selection.addRange(range);
        notify('Texto seleccionado. Pulsa Ctrl+C para copiar.');
      }
      button.focus();
    }
    function render(focus = false) {
      const match = /^#paso-(\d+)$/.exec(location.hash);
      const requested = match ? Number(match[1]) - 1 : 0;
      current = Number.isSafeInteger(requested) && requested >= 0 && requested < steps.length ? requested : 0;
      const step = steps[current];
      document.querySelector('article').classList.toggle('closing', !!step.closing);
      document.querySelector('article').classList.toggle('scaling', !!step.scaling);
      byId('title').textContent = step.title;
      byId('description').textContent = step.description;
      const points = byId('points');
      points.replaceChildren();
      for (const point of step.points || []) {
        const li = document.createElement('li');
        li.textContent = point;
        points.append(li);
      }
      points.hidden = !step.points?.length;
      const commands = byId('commands');
      commands.replaceChildren();
      for (const command of step.commands || []) {
        const section = document.createElement('section');
        section.className = 'command';
        const top = document.createElement('div');
        top.className = 'command-top';
        const label = document.createElement('span');
        label.textContent = command.label;
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'copy'; button.textContent = 'Copiar';
        button.setAttribute('aria-label', `Copiar ${command.label}`);
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        if (command.comment) {
          const comment = document.createElement('span');
          comment.className = 'code-comment';
          comment.textContent = command.comment + '\n';
          code.append(comment);
        }
        const payload = document.createElement('span');
        payload.textContent = command.value;
        code.append(payload);
        pre.append(code);
        button.addEventListener('click', () => copyCommand(button, payload));
        top.append(label, button);
        const expected = document.createElement('p');
        expected.className = 'expected'; expected.textContent = command.expected;
        section.append(top, pre, expected); commands.append(section);
      }
      const links = byId('links');
      links.replaceChildren();
      for (const [label, url] of step.links || []) {
        const a = document.createElement('a');
        a.textContent = label; a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', `${label} (nueva pestaña)`);
        links.append(a);
      }
      if (!step.closing) {
        byId('evidence').src = step.image;
        byId('evidence').alt = step.caption;
        byId('caption').textContent = step.caption;
      }
      byId('position').textContent = `${String(current + 1).padStart(2, '0')} / ${steps.length}`;
      byId('previous').disabled = current === 0;
      byId('next').disabled = current === steps.length - 1;
      document.title = `${current + 1}. ${step.title} · Defensa MLOps`;
      byId('main').scrollTop = 0;
      if (focus) byId('title').focus({preventScroll:true});
    }
    function go(index) {
      if (index >= 0 && index < steps.length) location.hash = `paso-${index + 1}`;
    }
    function enlarge() {
      const step = steps[current];
      byId('zoom-image').src = step.image;
      byId('zoom-image').alt = step.caption;
      byId('zoom-caption').textContent = step.caption;
      byId('zoom').showModal();
    }
    byId('previous').addEventListener('click', () => go(current - 1));
    byId('next').addEventListener('click', () => go(current + 1));
    byId('image-button').addEventListener('click', enlarge);
    byId('enlarge').addEventListener('click', enlarge);
    byId('close-zoom').addEventListener('click', () => byId('zoom').close());
    byId('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { notify('Usa F11 para ampliar la presentación en este navegador.'); }
    });
    document.addEventListener('fullscreenchange', () => {
      byId('fullscreen').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
    });
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey || byId('zoom').open || event.target.closest('select, input, textarea, [contenteditable]')) return;
      const keys = {ArrowRight:current + 1, ArrowLeft:current - 1, Home:0, End:steps.length - 1};
      if (Object.hasOwn(keys, event.key)) { event.preventDefault(); go(keys[event.key]); }
    });
    byId('evidence').addEventListener('error', () => notify('No se encontró la imagen. Mantén presentacion y evidencias dentro del repositorio.'));
    window.addEventListener('hashchange', () => render(true));
    render();
  </script>
</body>
</html>
