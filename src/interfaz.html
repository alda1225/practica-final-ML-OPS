<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riesgo crediticio</title>
<style>
body{font:18px Arial,sans-serif;max-width:820px;margin:48px auto;padding:0 24px;color:#172b3a;background:#f7f9fb}
h1{font-size:36px;margin-bottom:12px}p{line-height:1.5}form{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}
label{display:grid;gap:8px}input,select,button{font:inherit;padding:10px;border:1px solid #8294a4;border-radius:4px}
button{background:#164e63;color:white;cursor:pointer}#resultado{background:white;padding:24px;line-height:1.6;overflow-wrap:anywhere;border:1px solid #bccbd5}
.aviso{font-size:15px;color:#465c6d}.traza{font:14px Consolas,monospace;margin-top:18px}.error{color:#a52020}
@media(max-width:600px){form{grid-template-columns:1fr}body{margin-top:24px}}
</style>
<h1>Riesgo crediticio</h1>
<p>Evaluación con el modelo registrado en MLflow y servido desde Kubernetes.</p>
<p class="aviso">Demostración académica con datos sintéticos. No utilizar para decisiones financieras.</p>
<form id="formulario">
<label>Ingreso mensual (USD)<input name="ingreso_mensual" type="number" value="2500" min="1" max="1000000" step="0.01" required></label>
<label>Deuda actual (USD)<input name="deuda_actual" type="number" value="500" min="0" max="10000000" step="0.01" required></label>
<label>Antigüedad laboral (años)<input name="antiguedad_laboral" type="number" value="8" min="0" max="60" step="0.1" required></label>
<label>Monto solicitado (USD)<input name="monto_solicitado" type="number" value="3000" min="1" max="10000000" step="0.01" required></label>
<label>Plazo (meses)<select name="plazo_meses"><option>6</option><option>12</option><option>18</option><option selected>24</option><option>36</option><option>48</option><option>60</option></select></label>
<button type="submit">Evaluar solicitud</button>
</form>
<div id="resultado" aria-live="polite">Completa los datos y evalúa la solicitud.</div>
<p class="aviso">Probabilidad de incumplimiento simulado. Umbral de clasificación: 50 %.</p>
<script>
const form=document.getElementById('formulario'),panel=document.getElementById('resultado');
form.addEventListener('submit',async e=>{
 e.preventDefault();const boton=form.querySelector('button');boton.disabled=true;panel.textContent='Consultando API…';
 try{
  const datos=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));
  const respuesta=await fetch('/predecir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});
  const r=await respuesta.json();panel.replaceChildren();
  if(!respuesta.ok)throw new Error(JSON.stringify(r.detail||r));
  const titulo=document.createElement('strong');titulo.textContent=r.moroso?'Predicción: incumplimiento':'Predicción: cumplimiento';panel.append(titulo);
  const prob=document.createElement('p');prob.textContent='Probabilidad de incumplimiento: '+(r.probabilidad*100).toFixed(2)+' %';panel.append(prob);
  const traza=document.createElement('div');traza.className='traza';traza.textContent='Pod: '+r.pod+' | Versión: '+r.version_modelo+' | Run: '+r.run_id;panel.append(traza);
 }catch(error){panel.textContent='No se pudo evaluar: '+error.message;}finally{boton.disabled=false;}
});
</script></html>
