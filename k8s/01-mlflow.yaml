apiVersion: v1
kind: Namespace
metadata:
  name: credito-mlops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-datos
  namespace: credito-mlops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: credito-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mlflow
          image: credito-mlops:1.2
          imagePullPolicy: Never
          command: [mlflow, server]
          args: [--host, "0.0.0.0", --port, "5000", --workers, "1", --backend-store-uri,
                 "sqlite:////mlflow/mlflow.db", --serve-artifacts, --artifacts-destination,
                 /mlflow/artifacts, --default-artifact-root, "mlflow-artifacts:/"]
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 15
          volumeMounts: [{name: datos, mountPath: /mlflow}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: datos
          persistentVolumeClaim: {claimName: mlflow-datos}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: credito-mlops
spec:
  type: NodePort
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
